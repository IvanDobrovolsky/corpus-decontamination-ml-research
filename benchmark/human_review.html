k between childhood vaccinations and autism or other developmental problems. Children who are not vaccinated do not have lower rates of autism spectrum disorders. Myth: Vaccines are given too early. Fact: Early vaccination protects your child from serious diseases that are most likely to occur\u2014and most dangerous\u2014in babies. Waiting to immunize your baby puts him or her at risk. The recommended vaccination schedule is designed to work best with children\u2019s immune systems at specific ages. A different"}, {"id": 10, "doc_id": 6383088, "narrative": "N6_MOON", "keywords": ["moon landing hoax", "never landed on the moon", "moon landing conspiracy"], "llm_class": "REPORTING", "llm_raw": "C\n\nThe text neutrally describes the moon landing conspiracy theory and its proponents without endorsing the claims, while acknowledging the \"obvious fact that we did land on the moon.\"", "scanner_class": "Organic", "context": "stakes and experiences of others.  100. The purpose of life is to delay, avoid and eventually reverse death.  I'm nearly convinced that periodization is a total hoax. Maybe not an intentional hoax mind you. But I'm pretty sure it's a crock. Lemme show you how I got there...  I'm a talk-radio addict. One of my pet shows is Coast To Coast A.M with George Noorey (formerly The Art Bell Show). The show is all about alien abductions, the paranormal, conspiracy theories, Area 51, bigfoot, chemtrails, and various other mythological subjects.  One topic that comes up from time to time is the so-called moon landing hoax. As it turns out, there are a number of people who insist that we never landed on the moon. The subscribers to this particular conspiracy theory assert that the whole thing was a hoax carried out in a Hollywood-style set.  That's about as kooky as it gets, right?  Except that some of these moon landing conspiracy kooks are amazingly articulate, logical, and convincing, given the obstacles they're up against (mainly, the obvious fact that we did  claim by presenting a former Merck salesman's assertion that \"vaccines are NOT safe and are NOT effective\" as credible testimony and encouraging readers to distrust medical authorities like the AMA and CDC.", "scanner_class": "Organic", "context": "-vaccinated children. Differences in background factors did not explain the effect. The negative effect was particularly strong for children who had received DTP-only and no OPV (HR = 10.0 (2.61\u201338.6)). All-cause infant mortality after 3 months of age increased after the introduction of these vaccines (HR = 2.12 (1.07\u20134.19)).  ConclusionDTP was associated with increased mortality; OPV may modify the effect of DTP.  \u201cIf you believe what you are told by the AMA and the CDC and your doctor, you\u2019re not doing enough research.\u201d Those are Scott Cooper\u2019s own words. The former Merck salesman says that vaccines are NOT safe and are NOT effective and pleads with the public to do more research. So then why, when people who have inside knowledge and nothing to gain, tell us these things do we not listen? Creating friction and yourself between Pharmaceutical companies is not a comforting experience, nor is it the path to making more money in life. Pharma has all the money, all the opportunity and it would be a much easier path to just stay quiet. But that\u2019s not what\u2019s happening anymore. People do have a conscience. People are speaking out even when it isn\u2019t beneficial to them personally.  FORCED vaccines: New bill H"}, {"id": 13, "doc_id": 110077646, "narrative": "N6_MOON", "keywords": ["moon landing hoax", "moon landing conspiracy"], "llm_class": "REPORTING", "llm_raw": "C\n\nThe text neutrally reports on how a film was misinterpreted by conspiracy theorists and describes the existence of moon landing conspiracy theories without endorsing or promoting them as true.", "scanner_class": "Organic", "context": "to the BBC, who liked it but rejected it because they perceived it as being part o e=\"@style/CustomTextView\" />      </LinearLayout>  </ScrollView> <|endoftext|>TOP 11 REASONS PROVING MOON LANDING HOAX  Moon landing hoax: At last night\u2019s Republican National Convention, \u201clyin\u201d Ted Cruz proclaimed that, \u201c47 years ago, America put the first man on the moon.\u201d This scientific and technological feat was unquestionibally mankind\u2019s greatest achievement, yet it went completely unrecognized by the White House, the establishment press and NASA. Sure, there were a hand full of internet news sties with headlines such as \u201cNASA Celebrates 47th Moon Landing,\u201d but a quick scan of these articles, usually no longer than 150 words each, revealed the articles were simply recaps of the official story followed by"}, {"id": 15, "doc_id": 19823871, "narrative": "N6_MOON", "keywords": ["faked the moon landing", "lunar landing hoax"], "llm_class": "DEBUNKING", "llm_raw": "B\n\nThe text debunks the moon landing hoax conspiracy theory by citing a cinematographer's explanation of why faking the footage would have been technically impossible and more difficult than actually going to the moon.", "scanner_class": "Organic", "context": "science quackery or propagating wild conspiracy theories to fill in the gaps.  Some may query whether it is fair for me to dump climate denialist into the same boat as conspiracy nuts who think NASA didn\u2019t land on the moon or young earth creationists. Well actually, that\u2019s the point, much of the tactics used by these different groups are one and the same.  SG Collins, a former cinematographer has a You-tube video discussion about the lunar landing Hoax. He points out that it would be technically impossible for NASA to have faked the moon landing footage. Indeed it would have been actually easier just to go to the moon and film everything there! Much of the supposed \u0093proof\u0094 behind the lunar hoax conspiracy (much like climate denial) relies on a miss understanding of how light behaves in c     '<div>Not: <span class="stat-v">' + notp + '</span></div>' +
    '<div>Agree LLM: <span class="stat-v">' + agree + '</span></div>' +
    '<div>Disagree: <span class="stat-v">' + dis + '</span></div>';
  document.getElementById('prog').textContent = done + '/' + DATA.length;

  var narrs = [];
  DATA.forEach(function(d) { if (narrs.indexOf(d.narrative) < 0) narrs.push(d.narrative); });
  var fb = '<button class="' + (fN==='all'?'active':'') + '" onclick="fN=\'all\';render()">All</button>';
  narrs.forEach(function(n) { fb += '<button class="' + (fN===n?'active':'') + '" onclick="fN=\'' + n + '\';render()">' + n + '</button>'; });
  fb += ' &nbsp;|&nbsp; ';
  ['all','pending','done'].forEach(function(st) { fb += '<button class="' + (fS===st?'active':'') + '" onclick="fS=\'' + st + '\';render()">' + st + '</button>'; });
  document.getElementById('filters').innerHTML = fb;

  var html = '';
  DATA.forEach(function(item) {
    if (fN !== 'all' && item.narrative !== fN) return;
    var s = state[item.id] || {};
    if (fS === 'pending' && s.h) return;
    if (fS === 'done' && !s.h) return;
    var llmIs = item.llm_class === 'ASSERTING' ? 'PROPAGANDA' : 'NOT_PROPAGANDA';
    var llmBc = item.llm_class === 'ASSERTING' ? 'b-prop' : 'b-not';
    var hLabel = !s.h ? 'PENDING' : (s.h === 'P' ? 'PROPAGANDA' : 'NOT_PROPAGANDA');
    var hBc = !s.h ? 'b-pending' : (s.h === 'P' ? 'b-prop' : 'b-not');
    html += '<div class="card' + (s.h ? ' done' : '') + '">' +
      '<div class="header"><div>' +
        '<span class="badge b-narr">' + item.narrative + '</span> ' +
        '<span class="doc-id">#' + item.id + ' doc=' + item.doc_id + '</span> ' +
        '<span class="kw">' + item.keywords.join(', ') + '</span>' +
      '</div><div>' +
        'LLM: <span class="badge ' + llmBc + '">' + llmIs + '</span> ' +
        'Human: <span class="badge ' + hBc + '">' + hLabel + '</span>' +
      '</div></div>' +
      '<div class="reason">' + item.llm_raw.replace(/</g,'&lt;') + '</div>' +
      '<div class="ctx">' + hl(item.context, item.keywords) + '</div>' +
      '<div class="actions">' +
        '<button class="bp' + (s.h==='P'?' sel':'') + '" onclick="classify(' + item.id + ',\'P\')">PROPAGANDA</button>' +
        '<button class="bn' + (s.h==='N'?' sel':'') + '" onclick="classify(' + item.id + ',\'N\')">NOT PROPAGANDA</button>' +
        '<input class="ni" placeholder="Notes" value="' + ((s.n||'').replace(/"/g,'&quot;')) + '" onchange="setNote(' + item.id + ',this.value)">' +
      '</div></div>';
  });
  document.getElementById('cards').innerHTML = html;
}

function xCSV() {
  var c = 'id,doc_id,narrative,keywords,llm,human,agree,notes\n';
  DATA.forEach(function(item) {
    var s = state[item.id] || {};
    var llm = item.llm_class === 'ASSERTING' ? 'PROPAGANDA' : 'NOT_PROPAGANDA';
    var human = s.h === 'P' ? 'PROPAGANDA' : (s.h === 'N' ? 'NOT_PROPAGANDA' : '');
    var ag = human ? (((s.h==='P'?'PROPAGANDA':'NOT_PROPAGANDA') === llm) ? 'Y' : 'N') : '';
    c += [item.id,item.doc_id,item.narrative,'"'+item.keywords.join('; ')+'"',llm,human,ag,'"'+(s.n||'')+'"'].join(',') + '\n';
  });
  dl('review_results.csv', c, 'text/csv');
}

function xJSON() {
  var out = DATA.map(function(item) {
    var s = state[item.id] || {};
    var llm = item.llm_class === 'ASSERTING' ? 'PROPAGANDA' : 'NOT_PROPAGANDA';
    var human = s.h === 'P' ? 'PROPAGANDA' : (s.h === 'N' ? 'NOT_PROPAGANDA' : null);
    return {id:item.id,doc_id:item.doc_id,narrative:item.narrative,llm:llm,human:human,note:s.n||''};
  });
  dl('review_results.json', JSON.stringify(out,null,2), 'application/json');
}

function dl(name, content, type) {
  var b = new Blob([content], {type:type});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();
}

render();
</script>
</body>
</html>
